name: Informe Estrategico Diario STURAM (Respaldo Manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo manual de respaldo (la ejecucion diaria corre en el servidor Debian local)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - send
          - force-send

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y enviar informe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$INPUT_MODE" = "test" ]; then
            python main.py --test-to "$GMAIL_SENDER"
          elif [ "$INPUT_MODE" = "force-send" ]; then
            python main.py --send --force
          else
            python main.py --send
          fi
