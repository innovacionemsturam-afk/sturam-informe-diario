name: Informe Estrategico Diario STURAM

on:
  schedule:
    # Ventanas 05:15, 05:45 y 06:15 America/Argentina/Cordoba (UTC-3), lunes a viernes.
    # Si la primera sale a tiempo, las siguientes ven history.json y terminan en 1s sin reenviar.
    - cron: '15 8 * * 1-5'
    - cron: '45 8 * * 1-5'
    - cron: '15 9 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecucion: test (envia solo a GMAIL_SENDER) o send (envia a los 17 destinatarios)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - send

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y enviar informe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_MODE: ${{ github.event.inputs.mode || 'send' }}
        run: |
          if [ "$RUN_MODE" = "test" ]; then
            python main.py --test-to "$GMAIL_SENDER"
          else
            python main.py --send
          fi

      - name: Guardar historial anti-duplicados
        if: ${{ (github.event.inputs.mode || 'send') == 'send' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "chore: update report history" && git push)
